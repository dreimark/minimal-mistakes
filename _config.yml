# Site Settings
title: "Micha Denkt In Text"
title_separator: "-"
subtitle: "Die Zukunft von dreimark.com – Gedanken, Projekte und mehr"
name: "Michael Huber"
description: "Der zentrale Ort für digitale Projekte, Automatisierung, Selfhosting und technische Inspirationen – bald die neue Heimat von dreimark.com"
locale: "de-DE"
url: "https://dreimark.com"
baseurl: "" # Site is hosted at root domain
repository: "https://github.com/dreimark/minimal-mistakes"
logo: "/assets/images/logo.png"
masthead_title: "Micha Denkt In Text"
breadcrumbs: true
minimal_mistakes_skin: "dark"

# Custom CSS
custom_css:
  - "/assets/css/custom.css"

# Author Information
author:
  name: "Michael Huber"
  avatar: "/assets/images/avatar.jpg"
  bio: "Dev, Tech Lover, Open Source Fan"
  location: "Offenburg, Germany"
  email: "michael@dreimark.com"
  links:
    - label: "Website"
      icon: "fas fa-fw fa-link"
      url: "https://dreimark.com"

# Footer Links
footer:
  links:
    - label: "Website"
      icon: "fas fa-fw fa-link"
      url: "https://dreimark.com"

# SEO and Sharing
og_image: "/assets/images/og-image.jpg"
copyright: "© 2025 Michael Huber"
copyright_url: "https://dreimark.com"

# Features
search: true
search_full_content: true
enable_copy_code_button: true

# Defaults for Posts
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true

# Markdown and Output Settings
markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"

# Permalinks
permalink: /:categories/:title/

# Pagination
paginate: 5
paginate_path: /page:num/

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-gist
  - jekyll-include-cache

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development

# Sass Settings
sass:
  sass_dir: _sass
  style: compressed

# Header Navigation
header:
  nav:
    - label: "About Me"
      url: "/about/"
    - label: "Posts"
      url: "/posts/"
    - label: "Contact"
      url: "/contact/"
