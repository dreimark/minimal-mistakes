title: "Micha Denkt In Text"
title_separator: "-"
subtitle: "Digitale Gedanken zu Code, Technik & Automatisierung"
name: "Michael Huber"
description: "Ein persönlicher Blog über Technologie, Automatisierung, Selfhosting und digitale Ideen"
locale: "de-DE"
url: "https://dreimark.com"
baseurl: ""
repository: "dreimark/dreimark.github.io"
logo: "/assets/images/logo.png"
masthead_title: "Micha Denkt In Text"
breadcrumbs: true
minimal_mistakes_skin: "dark"

custom_css:
  - /assets/css/custom.css

author:
  name: "Michael Huber"
  avatar: "/assets/images/avatar.jpg"
  bio: "Developer. Tech-Enthusiast. Open Source Fan."
  location: "Offenburg, Deutschland"
  email: "michael@dreimark.com"
  links:
    - label: "Website"
      icon: "fas fa-fw fa-link"
      url: "https://dreimark.com"
    - label: "E-Mail"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:michael@dreimark.com"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/dreimark"

social:
  type: "Person"
  name: "Michael Huber"
  links:
    - "https://github.com/dreimark"
    - "mailto:michael@dreimark.com"

footer:
  links:
    - label: "E-Mail"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:michael@dreimark.com"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/dreimark"

og_image: "/assets/images/og-image.jpg"
copyright: "© 2025 Michael Huber"
copyright_url: "https://dreimark.com"

search: true
search_full_content: true
enable_copy_code_button: true

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true

markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"

permalink: /:categories/:title/

paginate: 5
paginate_path: /page:num/

plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-include-cache
  - jekyll-paginate
  - jekyll-sitemap

category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/

compress_html:
  clippings: all
  ignore:
    envs: development

sass:
  sass_dir: _sass
  style: compressed
