# Site Settings
title: "Micha Denkt In Text"
title_separator: "-"
subtitle: "Digitale Gedanken zu Code, Technik & Automatisierung"
name: "Michael Huber"
description: "Ein persönlicher Blog über Tech, Automatisierung, Selfhosting und digitale Ideen"
locale: "de-DE"
url: "https://dreimark.com"
baseurl: ""
repository: "dreimark/dreimark.github.io"
logo: "/assets/images/logo.png"
masthead_title: "Micha Denkt In Text"
breadcrumbs: true
minimal_mistakes_skin: "dark"

# Custom CSS
custom_css:
  - /assets/css/custom.css

# Author Information
author:
  name: "Michael Huber"
  avatar: "/assets/images/avatar.jpg"
  bio: "Dev, Tech Lover, Open Source Fan"
  location: "Offenburg, Germany"
  email: "michael@dreimark.com"
  links:
    - label: "Website"
      icon: "fas fa-fw fa-link"
      url: "https://dreimark.com"
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:michael@dreimark.com"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/dreimark"

# Social Links
social:
  type: "Person"
  name: "Michael Huber"
  links:
    - "https://github.com/dreimark"
    - "mailto:michael@dreimark.com"

# Footer Links
footer:
  links:
    - label: "E-Mail"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:michael@dreimark.com"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/dreimark"

# SEO and Sharing
og_image: "/assets/images/og-image.jpg"
copyright: "© 2025 Michael Huber"
copyright_url: "https://dreimark.com"

# Features
search: true
search_full_content: true
enable_copy_code_button: true

# Defaults for Posts
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true

# Markdown and Output Settings
markdown: kramdown
highlighter: rouge
excerpt_separator: "\n\n"

# Permalinks
permalink: /:categories/:title/

# Pagination
paginate: 5
paginate_path: /page:num/

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-include-cache

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development

# Sass Settings
sass:
  sass_dir: _sass
  style: compressed
